name: Build TsuCore IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project TsuCore.xcodeproj -scheme TsuCore -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Make IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TsuCore.app Payload/
          zip -qr TsuCore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TsuCore-unsigned-ipa
          path: TsuCore.ipa
