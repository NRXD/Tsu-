name: TsuCore
options:
  bundleIdPrefix: com.tsucore
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TsuCore:
    type: application
    platform: iOS
    sources:
      - AppDelegate.swift
      - WebViewController.swift
      - injector.js
      - fakedeafen.js
      - picture.js
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "ツcore"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "ツcore needs the microphone to send your voice to Discord."
        NSCameraUsageDescription: "Discord may ask for the camera for video calls."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsucore.app
        TARGETED_DEVICE_FAMILY: "1,2"
